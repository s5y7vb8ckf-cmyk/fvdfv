<!doctype html><html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>مَحَلّك | MAHALAK</title><meta charset="utf-8"><link rel="stylesheet" href="style.css?v=11"></head><body><div id="screen"></div><template id="tpl-home"><header><nav><strong class="logo">مَحَلّك <span>MAHALAK</span></strong><a href="#account" data-view="account">حسابي / تسجيل الدخول</a><a href="#partner" data-view="partner">سجّل منشأتك</a><a href="#admin" data-view="admin">إدارة المنصة</a></nav><section class="hero"><small>وين ما تروح، لك مَحَلّك • المملكة العربية السعودية</small><h1>إقامتك القادمة تبدأ هنا.</h1><p>اكتشف الفنادق والشقق والمنتجعات في السعودية، واختر الإقامة التي تناسبك.</p></section></header><main><form id="search" class="search"><label>الوجهة<select name="city"><option value="">كل المدن</option><option>جدة</option><option>الرياض</option><option>مكة المكرمة</option><option>المدينة المنورة</option><option>أبها</option><option>الدمام</option></select></label><label>الوصول<input type="date" name="arrival" required></label><label>المغادرة<input type="date" name="departure" required></label><label>البالغون (18+)<input name="adults" type="number" min="1" max="60" value="2" required></label><label>الأطفال (0–17)<input name="children" type="number" min="0" max="17" value="0" required></label><label>عدد الغرف<input name="room_count" type="number" min="1" max="10" value="1" required></label><label>حيوان أليف<select name="pet"><option value="0">بدون حيوان</option><option value="1">مع حيوان أليف</option></select></label><div id="childAges" class="child-ages"></div><button>ابحث عن إقامتك</button></form><p id="mode" class="notice"></p><section><div class="heading"><div><small>استكشف المملكة</small><h2>وجهات تستحق الزيارة</h2></div></div><div class="destinations"><button data-city="جدة">جدة <small>عروس البحر الأحمر</small></button><button data-city="الرياض">الرياض <small>قلب المملكة</small></button><button data-city="مكة المكرمة">مكة المكرمة <small>وجهة روحانية</small></button><button data-city="أبها">أبها <small>طبيعة الجبال</small></button></div></section><section><div class="heading"><h2>أماكن الإقامة المتاحة</h2><select id="kind"><option value="">جميع الأنواع</option><option>فنادق</option><option>شقق</option><option>منتجعات</option></select></div><p id="message" role="status"></p><div id="results" class="cards"></div></section></main><dialog id="booking"><form id="book"><h2>طلب حجز</h2><p id="summary"></p><label>نوع الغرفة<select name="room_type" required></select></label><label>رقم الجوال<input name="phone" type="tel" autocomplete="tel" required placeholder="05XXXXXXXX"></label><label>الاسم الكامل<input name="guest" required maxlength="200"></label><label>البريد الإلكتروني<input type="email" name="email" required></label><p>الحجز بانتظار موافقة الإدارة، ولا يتم خصم أي مبلغ الآن.</p><button>إرسال طلب الحجز</button><button type="button" class="secondary" id="close">إغلاق</button><p id="bookmessage" role="status"></p></form></dialog><footer>© مَحَلّك | MAHALAK · السعودية · منصة حجوزات الإقامة</footer></template><template id="tpl-account"><header><nav><strong class="logo">مَحَلّك <span>MAHALAK</span></strong></nav></header><main class="auth-main"><div id="accountForms" class="auth-shell"><aside class="auth-brand"><span class="auth-mark">مَحَلّك</span><small>MAHALAK · SAUDI ARABIA</small><h1>إقامتك تبدأ<br>من مَحَلّك.</h1><p>اكتشف وجهتك القادمة، وتابع حجوزاتك من مكان واحد.</p><div class="auth-decoration" aria-hidden="true"></div></aside><section class="auth-content"><div class="auth-tabs" role="group" aria-label="نوع الحساب"><button type="button" data-auth="signin" aria-pressed="true">تسجيل الدخول</button><button type="button" data-auth="signup" aria-pressed="false">إنشاء حساب</button></div><p id="msg" class="auth-message" role="status" hidden></p><form id="signin" class="auth-form"><div><h2>أهلاً بعودتك</h2><p>سجّل دخولك إلى حسابك في مَحَلّك.</p></div><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required></label><label>كلمة المرور<span class="password-field"><input name="password" type="password" required autocomplete="current-password" placeholder="أدخل كلمة المرور"><button type="button" data-password>إظهار</button></span></label><button class="auth-submit">تسجيل الدخول</button><p class="auth-switch">ليس لديك حساب؟ <button type="button" data-auth="signup">إنشاء حساب جديد</button></p></form><form id="signup" class="auth-form" hidden><div><h2>أنشئ حسابك</h2><p>ابدأ رحلتك مع مَحَلّك.</p></div><label>الاسم الكامل<input name="name" autocomplete="name" maxlength="200" placeholder="الاسم الكامل" required></label><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required></label><label>رقم الجوال (اختياري)<input name="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="05XXXXXXXX"></label><label>كلمة المرور<span class="password-field"><input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password" placeholder="10 أحرف على الأقل"><button type="button" data-password>إظهار</button></span></label><label>تأكيد كلمة المرور<span class="password-field"><input name="confirm" type="password" required autocomplete="new-password" placeholder="أعد إدخال كلمة المرور"><button type="button" data-password>إظهار</button></span></label><button class="auth-submit">إنشاء الحساب</button><p class="auth-switch">لديك حساب بالفعل؟ <button type="button" data-auth="signin">تسجيل الدخول</button></p></form><div class="auth-partner">تمثل منشأة سياحية؟ <a href="#partner" data-view="partner">بوابة شركاء مَحَلّك</a></div></section></div><section id="profile" hidden class="panel"><h1>حسابي</h1><h2 id="who"></h2><p id="profileEmail"></p><button id="logout">تسجيل الخروج</button><p id="profileStatus" role="status"></p></section></main><footer>© مَحَلّك | MAHALAK · المملكة العربية السعودية</footer></template><template id="tpl-trips"><header><nav><strong class="logo">مَحَلّك <span>MAHALAK</span></strong></nav></header><main><h1>حجوزاتي</h1><section class="panel"><p id="tripStatus" role="status">جاري تحميل الحجوزات…</p><div id="trips"></div><a href="#account" data-view="account" id="tripLogin" hidden>تسجيل الدخول</a></section></main></template><template id="tpl-partner"><header><nav><strong class="logo">مَحَلّك <span>MAHALAK</span></strong></nav></header><main class="pms"><div id="msg" class="pms-msg" role="status"></div><div id="forms" class="auth-shell"><aside class="auth-brand"><span class="auth-mark">مَحَلّك</span><small>PARTNER PORTAL</small><h1>إدارة ضيافتك<br>بكل احتراف.</h1><p>منصة واحدة لإدارة منشأتك وغرفك وحجوزاتك.</p></aside><section class="auth-content"><div class="auth-tabs"><button data-pauth="login">تسجيل الدخول</button><button data-pauth="register">انضم كشريك</button></div><form id="login"><h2>دخول الشركاء</h2><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button>تسجيل الدخول</button></form><form id="register" hidden><h2>إنشاء حساب منشأة</h2><label>اسم المنشأة<input name="name" required></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>الجوال<input name="phone" required></label><label>الترخيص السياحي<input name="license_number" required></label><label>كلمة المرور<input name="password" type="password" minlength="10" required></label><label>تأكيد كلمة المرور<input name="confirm" type="password" required></label><button>إنشاء حساب</button></form></section></div><div id="dashboard" hidden><div class="pms-shell"><aside class="pms-side"><div class="pms-brand">مَحَلّك <small>إدارة الضيافة</small></div><div id="status" class="pms-status"></div><div id="operations"><button data-page="overview">▦ &nbsp; نظرة عامة والتقارير</button><button data-page="rooms">▤ &nbsp; إدارة الغرف</button><button data-page="properties">⌂ &nbsp; المنشآت</button><button data-page="gallery">▧ &nbsp; صور الفندق والغرف</button><button data-page="reservations">▣ &nbsp; الحجوزات</button></div><button data-page="settings">⚙ &nbsp; إعدادات الحساب</button><button id="logout">↪ &nbsp; تسجيل الخروج</button></aside><div class="pms-content"><div class="pms-top"><div><small>بوابة شركاء مَحَلّك</small><h1 id="pmsTitle">نظرة عامة</h1></div><button id="refreshHotel" class="secondary">تحديث البيانات</button></div><section data-pms="overview"><div class="pms-filters"><label>المنشأة<select id="reportHotel"></select></label><label>من<input id="reportFrom" type="date"></label><label>إلى<input id="reportTo" type="date"></label></div><div id="reportMetrics" class="hotel-metrics"></div><p id="reportNote" class="notice"></p><button id="reportPrint" class="secondary">طباعة التقرير</button></section><section data-pms="rooms" hidden><div class="pms-filters"><label>المنشأة<select id="roomHotel"></select></label><label>البحث<input id="roomSearch" placeholder="رقم الغرفة أو النوع"></label><label>الحالة<select id="roomFilter"><option value="">الكل</option><option value="vacant">فارغة</option><option value="occupied">مشغولة</option><option value="dirty">تحتاج تنظيف</option><option value="cleaning">قيد التنظيف</option><option value="maintenance">صيانة</option></select></label><button id="addRoom">+ إضافة غرفة</button></div><div id="roomMetrics" class="hotel-metrics"></div><div id="roomList" class="pms-room-grid"></div><p class="notice">الإشغال الفعلي حسب تسجيل الوصول والمغادرة. سجّل جميع أرقام الغرف؛ الحجوزات الجديدة حسب نوع الغرفة وعددها.</p></section><section data-pms="properties" hidden><details class="panel"><summary>+ إضافة منشأة</summary><form id="hotel"><label>اسم المنشأة<input name="name" required></label><label>المدينة<input name="city" required></label><label>النوع<select name="kind"><option>فنادق</option><option>شقق</option><option>منتجعات</option></select></label><label>سعر الليلة<input name="price" type="number" min="1" required></label><label>عدد الغرف<input name="rooms" type="number" min="1" required></label><label>الوصف<textarea name="description"></textarea></label><label>سياسة الحيوانات الأليفة<select name="pets_allowed"><option value="0">غير مسموح</option><option value="1">مسموح</option></select></label><label>مرافق الفندق<input name="amenities" type="hidden"><div id="hotelAmenities" class="amenity-picker"></div></label><button>حفظ المنشأة</button></form></details><div id="inventory"></div></section><section data-pms="gallery" hidden><div class="pms-filters"><label>المنشأة<select id="galleryHotel"></select></label><label>نوع الصور<select id="galleryRoom"></select></label></div><div class="panel"><label>اختر الصور من الألبوم<input id="galleryFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="uploadGallery">رفع الصور إلى Google Drive</button></div><div id="galleryGrid" class="pms-gallery"></div></section><section data-pms="reservations" hidden><div class="pms-filters"><label>البحث في الحجوزات<input id="bookingSearch" placeholder="الاسم، رقم الحجز، الجوال"></label></div><div id="bookings"></div></section><section data-pms="settings" hidden><div class="panel"><h2>تغيير كلمة المرور</h2><form id="password"><label>كلمة المرور الحالية<input name="old" type="password" required></label><label>كلمة المرور الجديدة<input name="password" type="password" minlength="10" required></label><button>حفظ كلمة المرور</button></form></div></section></div></div></div><dialog id="roomDialog"><form id="roomForm"><h2 id="roomTitle">بيانات الغرفة</h2><input name="id" type="hidden"><label>رقم الغرفة<input name="number" required></label><label>الطابق<input name="floor"></label><label>نوع الغرفة<input name="type" placeholder="ديلوكس، جناح، مفردة" required></label><label>عدد النزلاء<input name="capacity" type="number" min="1" max="30" required></label><label>المرافق والتجهيزات<input name="amenities" type="hidden"><div id="roomAmenities" class="amenity-picker"></div></label><label>ملاحظات واحتياجات<textarea name="notes"></textarea></label><button>حفظ الغرفة</button><button type="button" class="secondary" id="closeRoom">إغلاق</button></form></dialog><dialog id="stateDialog"><form id="stateForm"><h2 id="stateTitle"></h2><input name="id" type="hidden"><label>النظافة<select name="housekeeping"><option value="clean">نظيفة وجاهزة</option><option value="dirty">تحتاج تنظيف</option><option value="cleaning">قيد التنظيف</option><option value="inspection">بانتظار الفحص</option></select></label><label>الصيانة<select name="service"><option value="ready">صالحة للخدمة</option><option value="maintenance">خارج الخدمة / صيانة</option></select></label><label>الملاحظات<textarea name="notes"></textarea></label><button>حفظ الحالة</button><button type="button" class="secondary" id="closeState">إغلاق</button></form></dialog><dialog id="checkDialog"><form id="checkForm"><h2>تسجيل وصول النزيل</h2><input name="id" type="hidden"><label>الحجز المؤكد<input id="checkSearch" placeholder="الاسم، رقم الحجز، رقم الجوال" autocomplete="off"><select name="booking" required></select><small id="checkInfo"></small><label>عدد النزلاء في هذه الغرفة<input name="guest_count" type="number" min="1" required value="1"></label></label><button>تسجيل الوصول</button><button type="button" id="closeCheck" class="secondary">إغلاق</button></form></dialog></main></template><template id="tpl-admin"><header><nav><strong class="logo">مَحَلّك <span>MAHALAK</span></strong><a href="#home" data-view="home">الموقع الرئيسي</a></nav></header><main><h1>لوحة الإدارة</h1><p id="msg" role="status"></p><section class="panel" id="loginpanel"><form id="login"><label>كلمة مرور الإدارة<input type="password" name="password" required></label><button>دخول</button></form></section><div id="dashboard" hidden><button id="adminLogout">خروج من الإدارة</button><section class="panel"><h2>اعتماد شركاء مَحَلّك</h2><div id="partners"></div></section><section class="panel"><h2>إضافة عقار</h2><form id="hotel"><label>الاسم<input name="name" required></label><label>المدينة<input name="city" required></label><label>النوع<select name="kind"><option>فنادق</option><option>شقق</option><option>منتجعات</option></select></label><label>سعر الليلة بالريال<input type="number" min="1" name="price" required></label><label>عدد الغرف<input type="number" min="1" name="rooms" required></label><label>الوصف<input name="description"></label><label>صور من الألبوم<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="preview"></div><button>إضافة العقار</button></form><p id="inventory"></p><label>إضافة صور لعقار موجود<select id="existing"></select></label><input id="extra" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="uploadExtra">رفع الصور</button><p id="sync"></p></section><section class="panel"><h2>طلبات الحجز</h2><div class="tablewrap"><table><thead><tr><th>المرجع</th><th>العقار</th><th>الضيف</th><th>البريد</th><th>الوصول</th><th>المغادرة</th><th>الإجمالي</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></template><script src="config.js"></script><script src="app.js?v=11"></script></body></html>
